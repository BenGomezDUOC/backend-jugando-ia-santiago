server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: ms-clientes-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/clientes/**

        - id: ms-premios-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/premios/**

        - id: ms-localizaciones-route
          uri: http://localhost:8083
          predicates:
            - Path=/api/localizaciones/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
