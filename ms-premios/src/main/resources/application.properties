server.port=8082

# Base de datos MySQL independiente para Premios / Gamificación
spring.datasource.url=jdbc:mysql://localhost:3306/bd_triskeledu_premios?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# URLs de servicios colaboradores
app.services.clientes-url=http://localhost:8081
app.services.localizaciones-url=http://localhost:8083

# Formato de fechas
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=America/Santiago
