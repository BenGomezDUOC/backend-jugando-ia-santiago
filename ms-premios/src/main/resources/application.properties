server.port=8082

# Base de datos MySQL independiente
spring.datasource.url=jdbc:mysql://localhost:${MYSQL_PORT:3306}/bd_triskeledu_premios?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Servicios colaboradores
app.services.clientes-url=http://localhost:8081
app.services.localizaciones-url=http://localhost:8083

# Seguridad JWT
app.jwt.secret=${JWT_SECRET:dHJpc2tlbGVkdS1qd3Qtc2VjcmV0LWtleS0yMDI2LXN1cGVyLXNlZ3VyYS0yNTY=}

# Comunicacion interna con ms-clientes
app.internal.premios-key=${MS_PREMIOS_INTERNAL_KEY:dHJpc2tlbGVkdS1wcmVtaW9zLWludGVybmFsLWtleS0yMDI2LTI1NmJpdHM=}

# Formato de fechas
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=America/Santiago

# Almacenamiento privado de selfies.
app.selfies.directory=${SELFIE_STORAGE_DIR:./almacenamiento/premios/selfies}

# Limites para subir fotografias.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB