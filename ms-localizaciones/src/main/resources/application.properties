server.port=8083

# Base de datos MySQL independiente
spring.datasource.url=jdbc:mysql://localhost:${MYSQL_PORT:3306}/bd_triskeledu_localizaciones?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Seguridad JWT
app.jwt.secret=${JWT_SECRET:dHJpc2tlbGVkdS1qd3Qtc2VjcmV0LWtleS0yMDI2LXN1cGVyLXNlZ3VyYS0yNTY=}

# Formato de fechas
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=America/Santiago

# Almacenamiento multimedia
app.storage.directory=${MEDIA_STORAGE_DIR:./almacenamiento/localizaciones}

# Limites de carga de archivos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=205MB