server.port=8081

# Base de datos MySQL independiente para Clientes
spring.datasource.url=jdbc:mysql://localhost:${MYSQL_PORT:3306}/bd_triskeledu_clientes?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Formato de fechas
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=America/Santiago

# Contrasenas de las cuentas del sistema
app.seed.admin-password=${ADMIN_PASSWORD:123}
app.seed.generador-password=${GENERADOR_PASSWORD:123}

# Configuracion JWT
app.jwt.secret=${JWT_SECRET:dHJpc2tlbGVkdS1qd3Qtc2VjcmV0LWtleS0yMDI2LXN1cGVyLXNlZ3VyYS0yNTY=}
app.jwt.expiration-seconds=3600

# Seguridad interna entre microservicios
app.internal.premios-key=${MS_PREMIOS_INTERNAL_KEY:dHJpc2tlbGVkdS1wcmVtaW9zLWludGVybmFsLWtleS0yMDI2LTI1NmJpdHM=}